    Payments.PaymentDiscount:
      type: object
      properties:
        discountName:
          type: string
          description: The discount’s name, meant to be displayable to the customer.
          nullable: false
        discountDescription:
          type: string
          description: The discount’s description. Use this field to optionally store a long form explanation of the product being sold for your own rendering purposes.
          nullable: true
        amount:
          type: integer
          description:  A non-negative integer in cents representing how much to subtract from the total. Must be specified when both `type` and `value` are null.
          format: int32
        type:
          $ref: '#/components/schemas/Payments.DiscountType'
        value:
          type: integer
          description: The value of the discount, contextual to the selected `type`. Must be specified when `type` is provided and `amount` is null.
          format: int32
          nullable: true
        index:
          type: integer
          description: Defines the application order of this discount relative to others.
          format: int32
          nullable: true
      additionalProperties: false
    Payments.DiscountType:
      enum:
        - DOLLAROFF
        - PERCENOFF
        - FIXED
      description: |
        Defines how the discount is calculated:
        - `DOLLAROFF`: A fixed amount in cents is subtracted from the total.
        - `PERCENOFF`: A percentage of the total amount is subtracted.
        - `FIXED`: The final price is set to a fixed amount, overriding the original total.
      type: string
    Payments.PaymentLine:
      type: object
      properties:
        quantity:
          type: integer
          description: The quantity of the line item being purchased.
          format: int32
        productId:
          type: string
          description: The ID of the Product that this PaymentLine will belong to. One of `productId` or `productName` is required. When `productId` is provided, all other product-related fields will be ignored, as their values will be automatically loaded from the Product.
          nullable: true
        productName:
          type: string
          description: The product’s name, meant to be displayable to the customer. One of `productId` or `productName` is required.
          nullable: true
        productVariant:
          type: string
          description: The product’s variant description, meant to be displayable to the customer.
          nullable: true
        productImage:
          type: string
          description: The product’s image, meant to be displayable to the customer.
          nullable: true
        unitAmount:
          type: integer
          description: A non-negative integer in cents representing how much to charge for each individual unit.
          format: int32
        unitDiscountAmount:
          type: integer
          description: A non-negative integer in cents representing the discount applied to each individual unit. This field is mutually exclusive with `discountAmount` — only one of the two may be specified.
          format: int32
        discountAmount:
          type: integer
          description: A non-negative integer in cents representing the total discount applied to the entire line. This field is mutually exclusive with `unitDiscountAmount` — only one of the two may be specified.
          format: int32
        finalAmount:
          type: integer
          description: A non-negative integer in cents representing how much to charge.
          format: int64
          readOnly: true
        taxRate:
          type: number
          description: The product's applicable tax rate.
          format: double
          nullable: true
        isFood:
          type: boolean
          description: Indicates whether this payment line refers to a food item. This flag is used to determine eligibility for meal vouchers or similar benefits.
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/Payments.PaymentLine.Modifier'
          nullable: true
      additionalProperties: false
    Payments.PaymentLine.Modifier:
      type: object
      properties:
        modifierId:
          type: string
          description: The ID of the Modifier that this customization will belong to.
        productId:
          type: string
          description: The ID of the Product that this customization will belong to.
        productName:
          type: string
          readOnly: true
        quantity:
          type: integer
        price:
          type: integer
      additionalProperties: false
    
