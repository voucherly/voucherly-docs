  /v1/payments:
    post:
      tags:
        - payment
      operationId: create-payment
      summary: Create a Payment
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Payment"
                - type: object
                  required: [email]
                  properties:
                    companyId:
                      type: string
                      description: |
                        The ID of the Company this Payment is associated with. If empty, the Company associated with the Customer will be used, if one exists. 
                        
                        You cannot specify both `customerId` and `companyId` at the same time.
                      nullable: true
                    customerId:
                      type: string
                      description: The ID of the Customer of this Payment. If empty a new Customer will be created.
                      nullable: true                    
                    timeout:
                      type: integer
                      description: Timeout in minutes for the checkout sessions. Default is 10.
                      format: int32
                      nullable: true
                    isPartialPayment:
                      type: boolean
                      description: >-
                        Enable or disable partial payments. When partial payment is enabled,
                        customers have the flexibility to pay a portion of the total amount.
                        Customers can decide to use alternative payment methods to cover the
                        remaining amount. When partial payment is disabled, customers are
                        required to pay the entire amount using a combination of payment
                        gateways.
                      nullable: true
                    isAutoConfirm:
                      type: boolean
                      description: "Enable or disable auto confirm.\r\nIf you don't specify anything the default Merchant configuration will be used.\r\nWhen auto confirm is enabled, payment is automatically confirmed before redirecting customer to RedirectSuccessUrl.\r\nWhen auto confirm is disabled, payment requires manual confirmation."
                      nullable: true
                    redirectOkUrl:
                      type: string
                      description: >-
                        The URL to which Voucherly should send customers when payment is complete.
                      nullable: false
                    redirectKoUrl:
                      type: string
                      description: >-
                        The URL to which Voucherly should send customers when payment is cancelled or failed.
                      nullable: false
                    callbackUrl:
                      type: string
                      description: The URL where Voucherly will send a Server-to-Server (S2S) callback notification when the payment status changes. This allows your system to be notified synchronously about payment updates.
                      nullable: true
                    language:
                      type: string
                      description: The language of Voucherly Checkout page.
                      nullable: true
                    country:
                      type: string
                      description: >-
                        The country of the purchase. If different from Italy, voucher
                        payment gateways are not shown.
                      nullable: true
                    shippingAddress:
                      type: string
                      description: Purchase shipping address.
                      nullable: true
            examples:
              'New customer':
                summary: Create payment with new customer
                value:
                  mode: Payment
                  redirectOkUrl: "https://httpbin.org/get"
                  redirectKoUrl: "https://httpbin.org/get"
                  customerFirstName: Mario
                  customerLastName: Rossi
                  customerEmail: mario.rossi@voucherly.it
                  country: IT
                  lines:
                    - quantity: 2
                      unitAmount: 250
                      unitDiscountAmount: 10
                      productName: Muffin
                      isFood: true
                  discounts:
                    - discountName: Coupon XSDWFE
                      amount: 200
      responses:
        '201':
          description: Returns a Payment object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: "#/components/responses/BadRequest"
  /v1/payments/{id}:
    get:
      tags:
        - payment
      operationId: retrieve-payment
      summary: Retrieve a Payment
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - name: include
          in: query
          description: 'An array of nested object to be included in response.'
          required: false
          schema:
            type: array
            items:
              type: string
              enum: ["Lines", "Discounts", "Transactions"]
        - name: Voucherly-Wait-Time
          in: header
          description: >-
            Seconds that the call will be hanging, waiting for a payment status
            change. Maximum value is 60 seconds.
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Returns a Payment object if a valid identifier was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
  /v1/payments/{id}/confirm:
    post:
      tags:
        - payment
      operationId: confirm-payment
      summary: Confirm a Payment
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
      responses:
        '200':
          description: Returns a Payment object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/PaymentConflict"
  /v1/payments/{id}/refund:
    post:
      tags:
        - payment
      operationId: refund-payment
      summary: Refund a Payment
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaymentRequest'
      responses:
        '200':
          description: Returns a Payment object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: "#/components/responses/BadRequest"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/PaymentConflict"
  /v1/payment_gateways:
    get:
      tags:
        - Payment Gateways
      operationId: list-payment_gateway
      summary: List all PaymentGateways
      parameters:
        - name: All
          in: query
          description: >-
            Specifies whether to return all payment gateways or only those are
            enabled. If true, returns all payment gateways regardless of their enabled status. If false or omitted, returns only enabled payment gateways.
          schema:
            type: boolean
        - name: Include
          in: query
          description: An array of nested object to be included in response.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - Parameters
            description: An array of nested object to be included in response.
      responses:
        '200':
          description: |
            A dictionary with a `items` property that contains an array of PaymentGateways. Each entry in the array is a separate PaymentGateway object. This request should never return an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentGatewaysResponse'
        '400':
          $ref: "#/components/responses/BadRequest"
components:
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      description: Unique identifier for the object.
      schema:
        $ref: '#/components/schemas/Id'
    CustomerIdPathParam:
      name: customerId
      in: path
      required: true
      description: Unique identifier for the Customer.
      schema:
        $ref: '#/components/schemas/Id'
    PaymentMethodIdPathParam:
      name: paymentMethodId
      in: path
      required: true
      description: Unique identifier for the PaymentMethod.
      schema:
        $ref: '#/components/schemas/Id'
    PageSizeQueryParam:
      name: length
      in: query
      required: false
      description: A limit on the number of objects to be returned. Limit can range between 1 and 100, and the default is 10.
      schema:
        type: integer
    PageStartQueryParam:
      name: start
      in: query
      required: false
      description: A cursor for pagination across multiple pages of results. Don’t include this parameter on the first call. Use the `nextStart` value returned in a previous response to request subsequent results.
      schema:
        type: string
  schemas:
    Id:
      type: string
      description: Unique identifier for the object.
      nullable: false
      readOnly: true
    Company:
      x-tags:
        - company
      x-displayName: "Company"
      type: object
      description: The Company object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        tenant:
          $ref: '#/components/schemas/TenantMode'
        joinCode:
          type: string
          description: A unique 6-character code that can be used to join or reference this Company.
          nullable: false
          minLength: 6
          maxLength: 6
        name:
          type: string
          description: Company name.
          nullable: false
        addresses:
          type: array
          description: An array of delivery addresses associated with this Company. Each address can have specific delivery fees and store information.
          items:
            $ref: '#/components/schemas/CompanyAddressForExternalApi'
          nullable: true
          readOnly: true
      additionalProperties: false
    Customer:
      x-tags:
        - customer
      type: object
      description: The Customer object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        tenant:
          $ref: '#/components/schemas/TenantMode'
        email:
          type: string
          description: The customer’s email address.
          nullable: false
        firstName:
          type: string
          description: The customer’s first name.
          nullable: true
        lastName:
          type: string
          description: The customer’s last name.
          nullable: true
        phoneNumber:
          type: string
          description: The customer’s phone number.
          nullable: true
        referenceId:
          type: string
          description: A unique identifier from your system that you can use to reference this Customer. This can be used to reconcile the Customer with your internal systems.
          nullable: true
        companyId:
          type: string
          description: The ID of the Company this Customer is associated with.
          nullable: true
        wallet:
          allOf:
            - $ref: "#/components/schemas/CustomerWalletTotals"
          readOnly: true
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: true # I need this because it's used in create request (probably it's a plugin bug)
    CustomerWalletTotals:
      type: object
      description: Summary information about the Customer's wallet, including total amounts and last update timestamp.
      properties:
        totalAmount:
          type: integer
          format: int64
          description: The total amount available in the customer's wallet, in cents.
        totalVoucherAmount:
          type: integer
          format: int64
          description: The total amount of voucher funds available in the customer's wallet, in cents.
        lastUpdatedOnUtc:
          type: string
          format: date-time
          description: The UTC timestamp of when the wallet totals were last updated.
      additionalProperties: false
    CreditCardInfo:
      type: object
      description: If this is a card PaymentMethod, this contains the user’s card details.
      properties:
        brand:
          type: string
          description: Card brand
          nullable: false
        pan:
          type: string
          description: Card masked PAN
          nullable: false
        expiration:
          type: string
          description: The card's expiration date, typically in MM/YY format.
          nullable: false
        expirationMonth:
          type: integer
          format: int32
          description: Two-digit number representing the card’s expiration month.
          readOnly: true
        expirationYear:
          type: integer
          format: int32
          description: Four-digit number representing the card’s expiration year.
          readOnly: true
        product:
          type: string
          description: The card product type (e.g., "Visa Classic", "Mastercard Gold").
          nullable: false
      additionalProperties: false
    DirectDebitInfo:
      type: object
      description: If this is a sepa_debit PaymentMethod, this contains the user’s card details.
      properties:
        accountId:
          type: string
          description: ID of the bank account.
          nullable: false
        accountBic:
          type: string
          description: BIC of the bank account.
          nullable: false
        accountIban:
          type: string
