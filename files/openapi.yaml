    # PROBLEM DETAILS 
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type. It remains consistent across occurrences of the same error type.
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
        detail:
          type: string
          nullable: true
          description: A human-readable explanation specific to this occurrence of the problem.
      additionalProperties: true
    ValidationProblemDetails:
      properties:
        type:
          type: string
          nullable: true
          description: A URI reference that identifies the problem type.
          example: https://tools.ietf.org/html/rfc9110#section-15.5.1
        title:
          type: string
          description: A short, human-readable summary of the problem type. It remains consistent across occurrences of the same error type.
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 400
        detail:
          type: string
          nullable: true
          description: A human-readable explanation specific to this occurrence of the problem.
        code:
          type: string
          description: For some errors that could be handled programmatically, a short string indicating the error code reported.
        parameter:
          type: string
          nullable: true
          description: If the error is parameter-specific, the parameter related to the error. For example, you can use this to display a message near the correct form field.
      additionalProperties: false
    PaymentConflictProblemDetails:
      properties:
        title:
          type: string
          description: A short, human-readable summary of the problem type. It remains consistent across occurrences of the same error type.
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 409
        detail:
          type: string
          nullable: true
          description: A human-readable explanation specific to this occurrence of the problem.
        code:
          type: string
          description: For some errors that could be handled programmatically, a short string indicating the error code reported.
        paymentStatus:
          allOf:
            - $ref: '#/components/schemas/Payments.PaymentStatus'
      additionalProperties: false      
    # END PROBLEM DETAILS
  responses:
    BadRequest:
      description: The request was unacceptable, often due to missing a required parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            ValidationError:
              $ref: '#/components/examples/ValidationErrorExample'
            ResourceMissing:
              $ref: '#/components/examples/ResourceMissingExample'
    NotFound:
      description: The requested resource doesn’t exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datatracker.ietf.org/doc/html/rfc9110#section-15.5.5
            title:: Customer was not found.
            status: 404
            detail: Entity "Customer" (cs_YZOJp96qKlW) was not found.
            additional:
              entity: Customer
              key: cs_YZOJp96qKlW
              error: NotFound
    PaymentConflict:
      description: The request conflicts with the current state of the target resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentConflictProblemDetails'
          examples:
            InvalidStatus:
              value:
                title: This operation cannot be processed because payment is in an invalid status.
                status: 409
                detail: Only 'Paid' payment can be confirmed.
                code: INVALID_STATUS
                paymentStatus: Requested
            AlreadyProcessed:
              value:
                title: This operation is already processed.
                status: 409
                code: ALREADY_CONFIRMED
                paymentStatus: Confirmed
  examples:
    ValidationErrorExample:
      value:
        type: https://tools.ietf.org/html/rfc9110#section-15.5.1
        title: One or more validation errors occurred.
        status: 400
        detail: You should provide a well formatted CustomerId.
        code: VALIDATION_ERROR
        parameter: CustomerId
    ResourceMissingExample:
      description: |
        Returned when a specified resource could not be found within the application domain, despite the request being syntactically correct.
        Unlike a `404 NOT FOUND`, this error indicates that the endpoint exists, but the referenced entity (e.g., CustomerId, OrderId) does not exist in the system.
      value:
        type: https://tools.ietf.org/html/rfc9110#section-15.5.1
        title:: CustomerId not found.
        status: 400
        detail: "No such CustomerId: 'cs_YZOJp96qKlW'."
        code: RESOURCE_MISSING
        parameter: CustomerId
  securitySchemes:
    Voucherly-API-Key:
      type: apiKey
      in: header
      name: Voucherly-API-Key
      description: |
        Sandbox mode secret keys have the prefix `sk_sand_` and live mode secret keys have the prefix `sk_live_`.