        amount:
          type: integer
          format: int32
          description: The total amount of the Receipt, in cents.
        parentReceiptId:
          type: string
          description: The ID of the parent Receipt, when this Receipt is a void/refund of a previously issued Sale Receipt.
          nullable: true
      additionalProperties: false
    Terminals.TerminalStatus:
