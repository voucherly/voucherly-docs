          type: string
          description: The product’s image URL, meant to be displayable to the customer.
          nullable: true
        productExternalId1:
          type: string
          description: Primary external reference for the product, used by Voucherly to reconcile the product across systems and to correctly compute reporting.
          nullable: true
        productExternalId2:
          type: string
          description: Secondary external reference for the product, used by Voucherly to reconcile the product across systems and to correctly compute reporting.
          nullable: true
        taxRate:
          type: number
          format: double
          description: The product's applicable tax rate.
          nullable: true
        isFood:
          type: boolean
          description: Indicates whether this PaymentLine refers to a food item. This flag is used to determine eligibility for meal vouchers or similar benefits.
        isGift:
          type: boolean
          description: Indicates whether this PaymentLine is a gift item.
      additionalProperties: false
    Payments.PaymentLine.Request:
      type: object
      description: |
        Request shape of a PaymentLine, used in the create-payment request body. Product attributes are grouped under a nested `product` object; pricing and discount amounts stay at the line level.

        Each line must specify the product through one of:
        - `productId` only — all product details are loaded from the referenced Voucherly Product.
        - `product` only — inline ad-hoc product description; required fields inside `product` must be populated.
        - `productId` + `product` — the line is linked to the referenced Product, and any field set inside `product` overrides the corresponding value of the Product configuration (useful to force a specific price, name, etc.).
      properties:
        quantity:
          type: integer
          description: The quantity of the line item being purchased.
          format: int32          
        unitAmount:
          type: integer
          description: A non-negative integer in cents representing how much to charge for each individual unit. Required when `productId` is not specified.
          format: int32
          nullable: true
        unitDiscountAmount:
          type: integer
          description: A non-negative integer in cents representing the discount applied to each individual unit. This field is mutually exclusive with `discountAmount` — only one of the two may be specified.
          format: int32
        discountAmount:
          type: integer
          description: A non-negative integer in cents representing the total discount applied to the entire line. This field is mutually exclusive with `unitDiscountAmount` — only one of the two may be specified.
          format: int32
        productId:
          type: string
          description: The ID of an existing Product in Voucherly that this PaymentLine refers to. One of `productId` or `product` is required.
          nullable: true
        product:
          type: object
          description: |
            Inline description of the product associated with a PaymentLine, used inside the create-payment request body. Contains only product attributes; pricing and discount amounts are line-level fields on `Payments.PaymentLine.Request`.

            When the line also specifies a `productId`, all fields below are optional and any populated value overrides the configuration of the referenced Product. When `productId` is not specified, `name` must be populated (and `unitAmount` must be populated at the line level).
          properties:
            externalId:
              type: string
              description: An external reference for the product, used by Voucherly to reconcile the product across systems and to correctly compute reporting. Highly recommended whenever the product is not referenced via `productId`.
              nullable: true
            name:
              type: string
              description: The product’s name, meant to be displayable to the customer. Required when `productId` is not specified.
              nullable: true
            variant:
              type: string
              description: The product’s variant description, meant to be displayable to the customer.
              nullable: true
            image:
              type: string
              description: The product’s image URL, meant to be displayable to the customer.
              nullable: true
            taxRate:
              type: number
              description: The product's applicable tax rate.
              format: double
              nullable: true
            isFood:
              type: boolean
              description: Indicates whether this product is a food item. This flag is used to determine eligibility for meal vouchers or similar benefits.
              nullable: true
          additionalProperties: false
          nullable: true
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/Payments.PaymentLine.Modifier'
          nullable: true
      additionalProperties: false      
    Payments.PaymentLine.Modifier:
      type: object
      description: A modifier or customization applied to a payment line item (e.g., extra toppings, size options).
      properties:
        modifierId:
          type: string
          description: The ID of the Modifier that this customization belongs to.
          nullable: false
        productId:
          type: string
          description: The ID of the Product that this customization belongs to.
          nullable: false
        quantity:
          type: integer
          format: int32
          description: The quantity of this modifier.
      additionalProperties: false
    
    Payments.Transaction:
      type: object
      description: A Transaction represents a single payment attempt or operation within a Payment. A Payment can have multiple Transactions.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the transaction.
        paymentGatewayId:
          type: string
          description: The ID of the PaymentGateway used for this transaction.
          nullable: false
        paymentGateway:
          $ref: '#/components/schemas/PaymentGateways.PaymentGatewayEssential'
          description: Essential information about the PaymentGateway used for this transaction.
        externalId1:
          type: string
          description: The primary external transaction ID from the payment gateway provider.
          nullable: false
        externalId2:
          type: string
          description: An additional external transaction ID or reference from the payment gateway provider.
          nullable: true
        externalId3:
          type: string
          description: A third external transaction ID or reference from the payment gateway provider.
          nullable: true
        isWallet:
          type: boolean
          description: Indicates whether this transaction was paid using the customer's wallet balance.
        error:
          $ref: '#/components/schemas/Payments.TransactionError'
          description: Error information if the transaction failed.
        requestedAmount:
          type: integer
          format: int32
          description: The amount that was requested for this transaction, in cents.
        amount:
          type: integer
          format: int64
          description: The actual amount processed in this transaction, in cents.
        voucherAmount:
          type: integer
          format: int64
          description: The amount paid using vouchers in this transaction, in cents.
        noOfVouchers:
          type: integer
          format: int32
          description: The number of vouchers used in this transaction.
          nullable: true
        confirmedAmount:
          type: integer
          format: int64
          description: The amount that has been confirmed (captured) from this transaction, in cents.
        refundedAmount:
          type: integer
          format: int64
          description: The amount that has been refunded from this transaction, in cents.
        currency:
          type: string
          description: The currency code for this transaction (e.g., "EUR", "USD").
          nullable: false
        creditCard:
          $ref: '#/components/schemas/CreditCardInfo'
          description: Credit card information if this transaction was paid with a card.
        directDebit:
          $ref: '#/components/schemas/DirectDebitInfo'
          description: Direct debit (SEPA) information if this transaction was paid via direct debit.
        holderEmail:
          type: string
          description: The email address of the payment method holder for this transaction.
          nullable: true
        holderName:
          type: string
          description: The name of the payment method holder for this transaction.
          nullable: true
        status:
          $ref: '#/components/schemas/Payments.TransactionStatus'
          description: The current status of this transaction.
        request:
          $ref: '#/components/schemas/PaymentGateways.Checkout.PaymentRequest'
          description: Information about the payment request, including any redirect URL or action required.
      additionalProperties: false
    Payments.TransactionStatus:
      description: Current status of the Transaction.
      enum:
        - Requested
        - Paid
        - Confirmed
        - Refunded
        - RefundedPartially
        - Cancelled
        - Failed
        - Voided
        - Expired
        - Reversed
        - ImpossibleRefund
        - NextAction
      type: string
    Payments.TransactionError:
      description: The error encountered during the Transaction, if any.
      type: object
      properties:
        code:
          $ref: '#/components/schemas/Payments.TransactionErrorCode'
        externalError:
          $ref: '#/components/schemas/Payments.ExternalError'
      additionalProperties: false
    Payments.TransactionErrorCode:
      description: The type of error returned.
      enum:
        - Generic
        - Cancelled
        - NotCompleted
        - MissingPaymentMethod
        - Declined
        - System
      type: string
      
    Customers.CustomerAddress:
      type: object
      description: An address associated with a Customer.
      properties:
        id:
          type: string
          description: Unique identifier for the address.
          nullable: false
        label:
          type: string
          description: A friendly label or name for this address (e.g., "Home", "Work").
          nullable: true
        streetName:
          type: string
          description: The street name of the address.
          nullable: true
        streetNumber:
          type: string
          description: The street number of the address.
          nullable: true
        city:
          type: string
          description: The city of the address.
          nullable: true
        province:
          type: string
          description: The province or state of the address.
          nullable: true
        postalCode:
          type: string
          description: The postal or ZIP code of the address.
          nullable: true
        country:
          type: string
          description: The country code of the address (e.g., "IT" for Italy).
          nullable: true
      additionalProperties: false
    Customers.CustomerAddress.Request:
      type: object
      description: Request body for creating or updating a Customer address.
      required: [label, streetName, streetNumber, city, province, postalCode, country]
      properties:
        label:
          type: string
          description: A friendly label or name for this address (e.g., "Home", "Work").
          nullable: false
        streetName:
          type: string
          description: The street name of the address.
          nullable: false
        streetNumber:
          type: string
          description: The street number of the address.
          nullable: false
        city:
          type: string
          description: The city of the address.
          nullable: false
        province:
          type: string
          description: The province or state of the address.
          nullable: false
        postalCode:
          type: string
          description: The postal or ZIP code of the address.
          nullable: false
        country:
          type: string
          description: The country code of the address (e.g., "IT" for Italy).
          nullable: false
      additionalProperties: false
    Customers.CustomerWalletAction:
      description: |
        Type of wallet movement:
        - `PAYMENT`: amount debited from the wallet to settle a Payment.
        - `PAYMENT_R`: reversal of a `PAYMENT` movement.
        - `WALLET`: amount credited to the wallet (e.g., refund issued as credit).
        - `WALLET_R`: reversal of a `WALLET` movement.
        - `ADJUSTMENT`: manual adjustment performed by an operator.
      enum:
        - PAYMENT
        - PAYMENT_R
        - WALLET
        - WALLET_R
        - ADJUSTMENT
      type: string
    Customers.CustomerWalletMovement:
      type: object
      description: A single movement recorded on the Customer's wallet.
      properties:
        customerId:
          type: string
          description: The ID of the Customer this movement belongs to.
          nullable: false
        action:
          $ref: '#/components/schemas/Customers.CustomerWalletAction'
        transactionId:
          type: string
          format: uuid
          description: The ID of the Transaction that originated this movement, when applicable.
          nullable: true
        amount:
          type: integer
          format: int32
          description: The total amount of the movement, in cents.
        voucherAmount:
          type: integer
          format: int32
          description: The portion of `amount` attributable to vouchers, in cents.
        cashAmount:
          type: integer
          format: int32
          description: The portion of `amount` attributable to cash, in cents.
        runningTotalAmount:
          type: integer
          format: int64
          description: The wallet total balance after this movement was applied, in cents.
          nullable: true
        runningTotalVoucherAmount:
          type: integer
          format: int64
          description: The wallet voucher balance after this movement was applied, in cents.
          nullable: true
        runningTotalCashAmount:
          type: integer
          format: int64
          description: The wallet cash balance after this movement was applied, in cents.
          nullable: true
        occurredAtUtc:
          type: string
          format: date-time
          description: The UTC timestamp when this movement was recorded.
      additionalProperties: false
    Customers.PrepaidPolicy:
      type: object
      description: The prepaid policy that the Customer is subject to.
      properties:
        isActive:
          type: boolean
          description: Indicates whether the prepaid policy is currently active.
        amount:
          type: integer
          format: int32
          description: The maximum amount, in cents, that the Customer is allowed to spend in a single Date under this policy.
          nullable: true
      additionalProperties: false
    Customers.CustomerPrepaidBalance:
      type: object
      description: The prepaid balance available to a Customer for a given date.
      properties:
        paymentGatewayIsActive:
          type: boolean
          description: Indicates whether the prepaid PaymentGateway is currently configured and active for the Merchant.
        policy:
          allOf:
            - $ref: '#/components/schemas/Customers.PrepaidPolicy'
          nullable: true
        availableAmount:
          type: integer
          format: int32
          description: The remaining amount, in cents, that the Customer is still allowed to spend on the requested Date.
          nullable: true
        usedAmount:
          type: integer
          format: int32
          description: The amount, in cents, already spent by the Customer on the requested Date.
        date:
          type: string
          format: date
          description: The Date the balance refers to.
      additionalProperties: false
    Receipts.ReceiptType:
      description: |
        The fiscal type of the Receipt:
        - `Sale`: receipt issued for a successful Payment.
        - `Void`: receipt issued for a void or refund operation.
      enum:
        - Sale
        - Void
      type: string
    Receipts.Receipt:
      type: object
      description: A fiscal Receipt issued for a Payment.
      properties:
        id:
          type: string
          description: Unique identifier for the Receipt.
          nullable: false
        externalId:
