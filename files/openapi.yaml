          type: integer
          format: int32
          description: The quantity of the line item being purchased.
        unitAmount:
          type: integer
          format: int64
          description: A non-negative integer in cents representing how much to charge for each individual unit.
        unitDiscountAmount:
          type: integer
          format: int64
          description: A non-negative integer in cents representing the discount applied to each individual unit.
        discountAmount:
          type: integer
          format: int64
          description: A non-negative integer in cents representing the total discount applied to the entire line.
        finalAmount:
          type: integer
          format: int32
          description: A non-negative integer in cents representing the final amount charged for this line, after discounts.
          readOnly: true
        productId:
          type: string
          description: The ID of the Product that this PaymentLine refers to, when the line was created against an existing Voucherly Product.
          nullable: true
        productName:
          type: string
          description: The product’s name, meant to be displayable to the customer.
          nullable: false
        productVariant:
          type: string
          description: The product’s variant description, meant to be displayable to the customer.
          nullable: true
