        externalCreatedAt:
          type: string
          format: date-time
          description: The UTC timestamp when the Terminal was created in the PaymentGateway provider system.
        externalUpdatedAt:
          type: string
          format: date-time
          description: The UTC timestamp when the Terminal was last updated in the PaymentGateway provider system.
          nullable: true
      additionalProperties: false
    PaymentGateways.PaymentGatewayEssential:
      type: object
      description: Essential information about a PaymentGateway, used when embedded in other resources (e.g., Transactions, Terminals).
      properties:
        id:
          type: string
          description: Unique identifier for the PaymentGateway.
          nullable: false
        name:
          type: string
          description: The display name of the PaymentGateway (e.g., "Visa", "Mastercard", "Edenred").
          nullable: false
        type:
          $ref: '#/components/schemas/PaymentGateways.PaymentGatewayType'
        paymentAction:
          $ref: '#/components/schemas/PaymentGateways.CheckoutAction'
        image:
          type: string
          description: URL of the image to display for this PaymentGateway.
          nullable: true
        icon:
          type: string
          description: URL of the icon to display for this PaymentGateway.
          nullable: true
      additionalProperties: false
    PaymentGateways.GetPaymentGatewaysResponse:
      type: object
      description: Response object containing a list of available PaymentGateways.
      properties:
        items:
          type: array
          description: An array of PaymentGateway objects representing all available PaymentGateways.
          items:
            $ref: '#/components/schemas/PaymentGateways.PaymentGatewayDto'
          nullable: false
      additionalProperties: false
    MerchantPaymentGatewayDto:
      type: object
      description: Merchant-specific configuration for a payment gateway.
      properties:
        defaultPaymentGatewayId:
          type: string
          description: The ID of the default payment gateway to use if no specific gateway is selected.
          nullable: true
        isFallback:
