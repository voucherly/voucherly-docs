[build]
	command = "yarn build && node postbuild.mjs"
	publish = "build"

# --- Legacy path redirects (pre-i18n structure), now pointing under /en/ ---
[[redirects]]
from = '/terms/vsa'
to = '/en/terms/service'
status = 301

[[redirects]]
from = '/api/general/overview/'
to = '/en/api/webapi/voucherly-api/'
status = 301

[[redirects]]
from = '/api/general/authentication/'
to = '/en/api/webapi/voucherly-api/'
status = 301

[[redirects]]
from = '/api/general/miscellaneous/'
to = '/en/api/webapi/voucherly-api/'
status = 301

# --- Old un-prefixed English URLs -> /en/ (preserve SEO of already-indexed pages) ---
[[redirects]]
from = '/guides/*'
to = '/en/guides/:splat'
status = 301

[[redirects]]
from = '/api/*'
to = '/en/api/:splat'
status = 301

[[redirects]]
from = '/search'
to = '/en/search'
status = 301

[[redirects]]
from = '/download/*'
to = '/en/download/:splat'
status = 301

