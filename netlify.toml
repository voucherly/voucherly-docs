[build]
	command = "yarn build && node postbuild.mjs"
	publish = "build"

# Netlify applies the first rule that matches, so a specific rule has to come before the splat that would also match it.

# --- Legacy path redirects (pre-i18n structure) ---
[[redirects]]
from = '/terms/vsa'
to = 'https://legal.voucherly.it/terms/service/'
status = 301

[[redirects]]
from = '/api/general/overview/'
to = '/en/api/webapi/voucherly-api/'
status = 301

[[redirects]]
from = '/api/general/authentication/'
to = '/en/api/webapi/voucherly-api/'
status = 301

[[redirects]]
from = '/api/general/miscellaneous/'
to = '/en/api/webapi/voucherly-api/'
status = 301

# --- /api/ has no page of its own: the API section opens on its introduction ---
[[redirects]]
from = '/en/api/'
to = '/en/api/webapi/voucherly-api/'
status = 301

[[redirects]]
from = '/it/api/'
to = '/it/api/webapi/voucherly-api/'
status = 301

# --- Old un-prefixed English URLs -> /en/ (preserve SEO of already-indexed pages) ---
[[redirects]]
from = '/guides/*'
to = '/en/guides/:splat'
status = 301

[[redirects]]
from = '/api/*'
to = '/en/api/:splat'
status = 301

[[redirects]]
from = '/search'
to = '/en/search'
status = 301

[[redirects]]
from = '/download/*'
to = '/en/download/:splat'
status = 301

